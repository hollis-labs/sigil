name: light
description: Clean, modern light theme — base for all variants
tokens:
  colors:
    # Page
    background: "255 255 255"
    foreground: "17 24 39"

    # Cards and elevated surfaces
    card: "255 255 255"
    card-foreground: "17 24 39"

    # Popover / dropdown surfaces
    popover: "255 255 255"
    popover-foreground: "17 24 39"

    # Subtle backgrounds and muted text
    muted: "243 244 246"
    muted-foreground: "107 114 128"

    # Surfaces (Sigil-specific, used in preview)
    surface: "249 250 251"
    surface-2: "243 244 246"

    # Primary action color
    primary: "17 24 39"
    primary-foreground: "249 250 251"

    # Secondary action color
    secondary: "243 244 246"
    secondary-foreground: "17 24 39"

    # Accent / highlight
    accent: "243 244 246"
    accent-foreground: "17 24 39"

    # Semantic
    danger: "220 38 38"
    danger-foreground: "255 255 255"
    warning: "217 119 6"
    info: "37 99 235"
    success: "22 163 74"

    # Borders and dividers
    border: "229 231 235"
    input: "209 213 219"
    ring: "37 99 235"

    # Legacy aliases (used by preview renderer)
    text: "17 24 39"
    text-muted: "107 114 128"
    accent-hover: "29 78 216"
    danger-hover: "185 28 28"

  typography:
    font-sans: "Inter, system-ui, sans-serif"
    font-mono: "JetBrains Mono, monospace"

  radius:
    sm: "0.125rem"
    md: "0.375rem"
    lg: "0.5rem"
    xl: "0.75rem"
    full: "9999px"

  shadows:
    sm: "0 1px 2px 0 rgb(0 0 0 / 0.05)"
    md: "0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1)"
    lg: "0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1)"
