sigil: "1.0"
kind: page
id: forge-deployment-detail
title: Deployment Detail
overlay: sheet
module: forge

datasources:
  - alias: Deployment
    capabilities: [read]
    params:
      id: "{{param.id}}"
  - alias: DeploymentEvent
    capabilities: [read]

layout:
  id: root
  type: rows
  props:
    gap: 6
    padding: 6
  children:
    - type: breadcrumb
      props:
        items:
          - label: Deployments
            href: /forge-deployments
          - label: "{{data.Deployment.name}}"

    # ── Header ──────────────────────────────────
    - id: header
      type: columns
      props:
        justify: between
        align: center
      children:
        - type: columns
          props:
            gap: 3
            align: center
          children:
            - type: heading
              props:
                level: 2
                text: "{{data.Deployment.name}}"
            - type: badge
              props:
                text: "{{data.Deployment.status}}"
                variant: default
        - type: columns
          props:
            gap: 2
          children:
            - type: button
              props:
                label: Redeploy
                variant: primary
                icon: refresh-cw
              actions:
                click:
                  type: http
                  method: POST
                  url: "/api/deployments/{{param.id}}/redeploy"
                  onSuccess:
                    type: toast
                    title: success
                    message: Redeployment started
            - type: dropdown-menu
              props:
                trigger: "..."
                items:
                  - label: Rollback
                    icon: undo-2
                  - label: View Logs
                    icon: scroll-text
                  - separator: true
                  - label: Delete
                    icon: trash-2
                    destructive: true

    - type: separator

    # ── Tabs ────────────────────────────────────
    - type: tabs
      props:
        defaultTab: overview
      children:
        # Overview Tab
        - type: tab
          props:
            label: Overview
            value: overview
          children:
            - type: card
              children:
                - type: detail-view
                  props:
                    datasource: Deployment
                    layout: stacked
                    fields:
                      - label: Environment
                        field: environment
                      - label: Branch
                        field: branch
                      - label: Commit
                        field: commit
                      - label: Author
                        field: author
                      - label: Duration
                        field: duration
                      - label: Started
                        field: createdAt

        # Logs Tab
        - type: tab
          props:
            label: Logs
            value: logs
          children:
            - type: card
              props:
                title: Build Log
              children:
                - type: timeline
                  props:
                    datasource: DeploymentEvent

        # Domains Tab
        - type: tab
          props:
            label: Domains
            value: domains
          children:
            - type: card
              children:
                - type: text
                  props:
                    text: Custom domains and aliases.
                    muted: true
