sigil: "1.0"
kind: app
name: "Stack Explorer"
description: "AI agent tooling research platform — stack scoring and analysis"

api:
  base_url_env: "NEXT_PUBLIC_SE_API_URL"
  base_url_default: "http://localhost:8081"
  prefix: "/api"

modules:
  - id: se
    shell: se-shell
    route_group: "(explorer)"
    pages:
      - se-dashboard
      - se-repos
      - se-repo-detail
      - se-scorecards
      - se-gap-analysis
      - se-reports
      - se-patterns
      - se-findings
      - se-dimensions
      - se-settings

features:
  theme_toggle: true
  command_palette: true
  mobile_sidebar: true

providers:
  - id: lens
    datasource: Lens
    track_field: id
    label_field: name
    default: ""
    placeholder: "All Lenses"
    position: topbar
    ui_type: select

actions:
  - label: "Add Repo"
    icon: git-fork
    page: se-repos
    query: "action=create"
  - label: "Generate Report"
    icon: file-text
    page: se-reports
    query: "action=create"
  - label: "New Comparison"
    icon: git-compare
    page: se-gap-analysis
    query: "action=create"
