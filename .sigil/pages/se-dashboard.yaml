sigil: "1.0"
kind: page
id: se-dashboard
title: Dashboard
overlay: page
module: se

datasources:
  - alias: Repo
    capabilities: [list, filter]
  - alias: Finding
    capabilities: [list, filter]
  - alias: Scorecard
    capabilities: [list, filter]
  - alias: Dimension
    capabilities: [list]
  - alias: Pattern
    capabilities: [list]
  - alias: DimensionScore
    capabilities: [list]

layout:
  id: root
  type: rows
  props:
    gap: 6
    padding: 6
  children:
    # ── Header ──────────────────────────────────
    - id: header
      type: columns
      props:
        justify: between
        align: center
      children:
        - type: rows
          props:
            gap: 1
          children:
            - type: heading
              props:
                level: 1
                text: Dashboard
            - type: text
              props:
                text: AI agent tooling research landscape
                muted: true
        - type: columns
          props:
            gap: 2
          children:
            - type: select
              props:
                placeholder: Last 30 days
                options:
                  - value: 7d
                    label: Last 7 days
                  - value: 30d
                    label: Last 30 days
                  - value: 90d
                    label: Last 90 days
                  - value: all
                    label: All time
            - type: scan-runner
              props:
                repos: "{{repo}}"

    # ── Stat Cards ──────────────────────────────
    - type: grid
      props:
        columns: 5
        columns_md: 3
        columns_sm: 2
        gap: 4
      children:
        - type: stat-card
          props:
            label: Total Repos
            value: "{{repo.length}}"
            icon: git-fork
        - type: stat-card
          props:
            label: Scored
            value: "{{scoredRepos}}"
            trend: up
            icon: bar-chart-3
        - type: stat-card
          props:
            label: Dimensions
            value: "{{dimension.length}}"
            icon: layers
        - type: stat-card
          props:
            label: Patterns
            value: "{{pattern.length}}"
            icon: shapes
        - type: stat-card
          props:
            label: Findings
            value: "{{finding.length}}"
            trend: up
            icon: alert-triangle

    # ── Charts Row (custom components) ─────────
    - type: grid
      props:
        columns: 3
        columns_md: 2
        columns_sm: 1
        gap: 4
      children:
        - type: repos-by-category-chart
          props:
            repos: "{{repo}}"
        - type: score-distribution-chart
          props:
            scorecards: "{{scorecard}}"
        - type: own-vs-reference-chart
          props:
            repos: "{{repo}}"
            scorecards: "{{scorecard}}"
            dimensionScores: "{{dimensionScore}}"

    # ── Bottom Row ──────────────────────────────
    - type: grid
      props:
        columns: 2
        columns_sm: 1
        gap: 4
      children:
        # Top Scored Repos
        - type: card
          props:
            title: Top Scored Repos
            description: Highest overall scores in current lens
          children:
            - id: table-top-repos
              type: data-table
              props:
                datasource: Scorecard
                columns:
                  - label: Repo
                    field: repo_name
                    sortable: true
                  - label: Score
                    field: overall
                    sortable: true
                  - label: Lens
                    field: lens_name
                    render: badge
                    variants:
                      Engineering: info
                      Product: default
                      Leadership: warning
                      Security: danger
                      Community: success
                      Overall: default
                      Maintainability: info
                      Innovation: success
                      Adoption: warning
                pagination:
                  pageSize: 5
                dense: true

        # Recent Findings
        - type: card
          props:
            title: Recent Findings
            description: Latest research observations
          children:
            - id: table-recent-findings
              type: data-table
              props:
                datasource: Finding
                columns:
                  - label: Title
                    field: title
                    sortable: true
                  - label: Repo
                    field: repo_name
                  - label: Category
                    field: category
                    render: badge
                    variants:
                      gap: danger
                      strength: success
                      opportunity: info
                      risk: warning
                  - label: Severity
                    field: severity
                    render: badge
                    variants:
                      critical: danger
                      high: warning
                      medium: default
                      low: info
                pagination:
                  pageSize: 5
                dense: true
              actions:
                rowClick:
                  type: navigate
                  page: se-findings

    # ── Quick Actions ───────────────────────────
    - type: columns
      props:
        gap: 3
      children:
        - type: button
          props:
            label: Add Repo
            variant: outline
            icon: git-fork
          actions:
            click:
              type: navigate
              page: se-repos
              params:
                action: create
        - type: button
          props:
            label: Generate Report
            variant: outline
            icon: file-text
          actions:
            click:
              type: navigate
              page: se-reports
              params:
                action: create
        - type: button
          props:
            label: New Comparison
            variant: outline
            icon: git-compare
          actions:
            click:
              type: navigate
              page: se-gap-analysis
              params:
                action: create
