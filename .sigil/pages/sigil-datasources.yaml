sigil: "1.0"
kind: page
id: sigil-datasources
title: DataSources
overlay: page
module: sigil

datasources:
  - alias: SigilDataSource
    capabilities: [list, create, read, update, delete]

layout:
  id: root
  type: rows
  props:
    gap: 6
    padding: 6
  children:
    - id: header
      type: columns
      props:
        justify: between
        align: center
      children:
        - id: ds-title
          type: heading
          props:
            level: 1
            text: DataSources
        - id: new-ds-btn
          type: button
          props:
            label: New DataSource
            variant: primary
            icon: plus
          actions:
            click:
              type: modal
              title: New DataSource
              fields:
                - name: alias
                  label: Alias
                  type: text
                  required: true
                  placeholder: MyModel
                - name: description
                  label: Description
                  type: text
                  placeholder: Describe this datasource
              submit:
                datasource: SigilDataSource
                method: POST
    - id: ds-table
      type: data-table
      props:
        datasource: SigilDataSource
        columns:
          - label: Alias
            field: alias
            sortable: true
          - label: Description
            field: description
          - label: Fields
            field: field_count
          - label: Capabilities
            field: capabilities

shortcuts:
  - key: "n"
    action:
      type: modal
      title: New DataSource
      fields:
        - name: alias
          label: Alias
          type: text
          required: true
        - name: description
          label: Description
          type: text
      submit:
        datasource: SigilDataSource
        method: POST
    description: Create new datasource
  - key: Escape
    action:
      type: close
