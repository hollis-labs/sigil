sigil: "1.0"
kind: app
name: "Stack Explorer"
description: "AI agent tooling research platform — stack scoring and analysis"

api:
  base_url_env: "NEXT_PUBLIC_SE_API_URL"
  base_url_default: "http://localhost:8081"
  prefix: "/api"

modules:
  - id: se
    shell: se-shell
    route_group: "(explorer)"
    pages:
      - se-dashboard
      - se-repos
      - se-repo-detail
      - se-scorecards
      - se-gap-analysis
      - se-reports
      - se-patterns
      - se-findings
      - se-dimensions
      - se-settings
  - id: clockwork
    shell: clockwork-shell
    route_group: "(clockwork)"
    pages:
      - clockwork-board
      - clockwork-task-detail
      - clockwork-collections
      - clockwork-dashboard
      - clockwork-templates
      - clockwork-checkpoints
      - clockwork-runs
      - clockwork-models
      - clockwork-projects
      - clockwork-sprints
      - clockwork-settings
      - clockwork-plans
      - clockwork-plan-detail

features:
  theme_toggle: true
  command_palette: true
  mobile_sidebar: true

providers:
  - id: lens
    datasource: Lens
    track_field: id
    label_field: name
    default: ""
    placeholder: "All Lenses"
    position: topbar
    ui_type: select
  # Custom provider migrated from demo-clockwork/src/hooks/ (sprint 10 phase 2).
  # Phase 3 will regenerate demo-clockwork through react-shadcn SPA mode and
  # delete the hand-written copies under demo-clockwork/src/hooks/.
  - id: active-runs
    source:
      component: providers/active-runs-context.tsx
      export: ActiveRunsProvider
      includes:
        - providers/sse-active-runs-bridge.tsx
    mounts:
      - SSEActiveRunsBridge

actions:
  - label: "Add Repo"
    icon: git-fork
    page: se-repos
    query: "action=create"
  - label: "Generate Report"
    icon: file-text
    page: se-reports
    query: "action=create"
  - label: "New Comparison"
    icon: git-compare
    page: se-gap-analysis
    query: "action=create"
