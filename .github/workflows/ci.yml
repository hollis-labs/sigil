name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: lint + build + race
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOWORK: "off"
      GOMAXPROCS: "4"
      GOFLAGS: "-p=2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Lint changed code
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4
          args: --config ${{ github.workspace }}/.golangci.yml --timeout=3m --new-from-rev=${{ github.event.pull_request.base.sha || github.event.before }} ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test under race
        run: go test -p 2 -race -count=1 -timeout=3m ./...
