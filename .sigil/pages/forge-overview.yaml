sigil: "1.0"
kind: page
id: forge-overview
title: Overview
overlay: page
module: forge

datasources:
  - alias: Deployment
    capabilities: [list, filter]
  - alias: Asset
    capabilities: [list, filter]
  - alias: ScheduledJob
    capabilities: [list, filter]

layout:
  id: root
  type: rows
  props:
    gap: 6
    padding: 6
  children:
    # ── Header ──────────────────────────────────
    - id: header
      type: columns
      props:
        justify: between
        align: center
      children:
        - type: heading
          props:
            level: 1
            text: Overview
        - type: columns
          props:
            gap: 2
          children:
            - type: select
              props:
                placeholder: Last 24 hours
                options:
                  - value: 1h
                    label: Last hour
                  - value: 24h
                    label: Last 24 hours
                  - value: 7d
                    label: Last 7 days
                  - value: 30d
                    label: Last 30 days
            - type: icon-button
              props:
                icon: refresh-cw
                variant: ghost
                tooltip: Refresh data
              actions:
                click:
                  type: toast
                  message: Data refreshed
            - type: button
              props:
                label: Deploy
                variant: primary
                icon: rocket
              actions:
                click:
                  type: navigate
                  page: forge-deploy-create

    # ── Stat Cards ──────────────────────────────
    - type: grid
      props:
        columns: 4
        columns_sm: 2
        gap: 4
      children:
        - type: stat-card
          props:
            label: Deployments
            value: "142"
            trend: up
            icon: rocket

        - type: stat-card
          props:
            label: Uptime
            value: "99.98%"
            trend: up
            icon: activity

        - type: stat-card
          props:
            label: Assets
            value: "37"
            trend: down
            icon: server

        - type: stat-card
          props:
            label: Jobs
            value: "18"
            trend: neutral
            icon: clock

    # ── Charts Row ──────────────────────────────
    - type: grid
      props:
        columns: 2
        columns_sm: 1
        gap: 4
      children:
        - type: card
          props:
            title: Deployments Over Time
            description: Daily deployments — last 14 days
          children:
            - type: chart
              props:
                type: area
                xKey: day
                showLegend: true
                series:
                  - key: production
                    label: Production
                  - key: staging
                    label: Staging
                  - key: preview
                    label: Preview
                stacked: true
                data:
                  - { day: "Mar 16", production: 3, staging: 5, preview: 2 }
                  - { day: "Mar 17", production: 2, staging: 4, preview: 3 }
                  - { day: "Mar 18", production: 4, staging: 6, preview: 1 }
                  - { day: "Mar 19", production: 1, staging: 3, preview: 4 }
                  - { day: "Mar 20", production: 5, staging: 7, preview: 2 }
                  - { day: "Mar 21", production: 3, staging: 2, preview: 1 }
                  - { day: "Mar 22", production: 2, staging: 4, preview: 3 }
                  - { day: "Mar 23", production: 6, staging: 5, preview: 4 }
                  - { day: "Mar 24", production: 4, staging: 3, preview: 2 }
                  - { day: "Mar 25", production: 3, staging: 6, preview: 5 }
                  - { day: "Mar 26", production: 5, staging: 4, preview: 3 }
                  - { day: "Mar 27", production: 2, staging: 5, preview: 2 }
                  - { day: "Mar 28", production: 4, staging: 3, preview: 4 }
                  - { day: "Mar 29", production: 7, staging: 6, preview: 3 }

        - type: card
          props:
            title: Response Time
            description: P50/P95 latency — last 14 days
          children:
            - type: chart
              props:
                type: line
                xKey: day
                showGrid: true
                showLegend: true
                series:
                  - key: p50
                    label: P50 (ms)
                  - key: p95
                    label: P95 (ms)
                data:
                  - { day: "Mar 16", p50: 42, p95: 120 }
                  - { day: "Mar 17", p50: 38, p95: 115 }
                  - { day: "Mar 18", p50: 45, p95: 135 }
                  - { day: "Mar 19", p50: 51, p95: 180 }
                  - { day: "Mar 20", p50: 44, p95: 125 }
                  - { day: "Mar 21", p50: 40, p95: 110 }
                  - { day: "Mar 22", p50: 43, p95: 128 }
                  - { day: "Mar 23", p50: 47, p95: 145 }
                  - { day: "Mar 24", p50: 39, p95: 112 }
                  - { day: "Mar 25", p50: 41, p95: 118 }
                  - { day: "Mar 26", p50: 46, p95: 140 }
                  - { day: "Mar 27", p50: 43, p95: 130 }
                  - { day: "Mar 28", p50: 38, p95: 108 }
                  - { day: "Mar 29", p50: 45, p95: 122 }

    # ── Recent Deployments ──────────────────────
    - type: card
      props:
        title: Recent Deployments
      children:
        - id: recent-deploys
          type: data-table
          props:
            datasource: Deployment
            columns:
              - label: Status
                field: status
              - label: Name
                field: name
                sortable: true
              - label: Environment
                field: environment
              - label: Branch
                field: branch
              - label: Author
                field: author
              - label: Duration
                field: duration
              - label: Created
                field: createdAt
                sortable: true
            pagination:
              pageSize: 5
          actions:
            rowClick:
              type: sheet
              page: forge-deployment-detail
              params:
                id: "{{row.id}}"

    # ── Bottom Row ──────────────────────────────
    - type: columns
      props:
        gap: 4
      children:
        # Active Assets
        - type: card
          props:
            title: Asset Health
          children:
            - type: rows
              props:
                gap: 3
              children:
                - type: columns
                  props:
                    justify: between
                  children:
                    - type: text
                      props:
                        text: "Servers"
                    - type: badge
                      props:
                        text: "12 healthy"
                        variant: success
                - type: progress
                  props:
                    value: 100
                - type: columns
                  props:
                    justify: between
                  children:
                    - type: text
                      props:
                        text: "Databases"
                    - type: tooltip
                      props:
                        content: "db-replica-03 is experiencing high latency"
                        side: left
                      children:
                        - type: badge
                          props:
                            text: "1 degraded"
                            variant: danger
                - type: progress
                  props:
                    value: 85
                - type: columns
                  props:
                    justify: between
                  children:
                    - type: text
                      props:
                        text: "CDN"
                    - type: badge
                      props:
                        text: "4 healthy"
                        variant: success
                - type: progress
                  props:
                    value: 100

        # Recent Jobs
        - type: card
          props:
            title: Recent Jobs
          children:
            - type: list
              props:
                datasource: ScheduledJob
                emptyMessage: No recent jobs
              children:
                - type: columns
                  props:
                    justify: between
                    align: center
                  children:
                    - type: rows
                      props:
                        gap: 0
                      children:
                        - type: text
                          props:
                            text: "{{item.name}}"
                        - type: text
                          props:
                            text: "{{item.lastRun}}"
                            muted: true
                    - type: badge
                      props:
                        text: "{{item.status}}"
                        variant: default
