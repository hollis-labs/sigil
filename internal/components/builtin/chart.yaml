type: chart
category: data
description: "Data chart using recharts via SigilChart component"
props:
  type:
    type: string
    required: true
    description: "Chart type"
    enum: [bar, line, pie, area, donut]
  datasource:
    type: string
    description: "DataSource alias"
  xKey:
    type: string
    description: "Data key for x-axis labels"
  dataKeys:
    type: array
    description: "Data keys to plot as series"
  series:
    type: array
    description: "Series config: [{key, label, color}]"
  data:
    type: array
    description: "Inline chart data (used when no datasource)"
  height:
    type: integer
    description: "Chart height in pixels"
  showGrid:
    type: boolean
    description: "Show grid lines"
  showLegend:
    type: boolean
    description: "Show chart legend"
  stacked:
    type: boolean
    description: "Stack series on top of each other"
