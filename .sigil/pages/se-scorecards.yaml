sigil: "1.0"
kind: page
id: se-scorecards
title: Scorecards
overlay: page
module: se

datasources:
  - alias: Scorecard
    capabilities: [filter, sort, paginate]
  - alias: DimensionScore
    capabilities: [list]

layout:
  id: root
  type: rows
  props:
    gap: 5
    padding: 6
  children:
    # ── Header ──────────────────────────────────
    - type: columns
      props:
        justify: between
        align: center
      children:
        - type: rows
          props:
            gap: 1
          children:
            - type: heading
              props:
                level: 1
                text: Scorecards
            - type: text
              props:
                text: "Compare repos across dimensions — scores colored by range"
                muted: true
        - type: columns
          props:
            gap: 2
          children:
            - type: csv-export-button
              props:
                data: "{{scorecard}}"
                columns:
                  - { key: repo_name, header: Repo }
                  - { key: overall, header: "Overall Score" }
                  - { key: lens_name, header: Lens }
                  - { key: scored_at, header: "Scored At" }
                filename: "scorecards.csv"

    # ── Search ──────────────────────────────────
    - id: search-scorecards
      type: search-bar
      props:
        placeholder: "Search scorecards by repo name..."
        datasource: Scorecard
        debounce: 300

    # ── Scorecard Compare (table + checkboxes + compare sheet) ─
    - type: scorecard-compare
      props:
        scorecards: "{{scorecard}}"
        dimensionScores: "{{dimensionScore}}"

    # ── Dimension Heatmap ──────────────────────
    - type: card
      props:
        title: Dimension Heatmap
        description: "Per-dimension scores by repo — select a lens to compare"
      children:
        - type: scorecard-heatmap

    # ── Score Distribution ─────────────────────
    - type: score-distribution-chart
      props:
        scorecards: "{{scorecard}}"
