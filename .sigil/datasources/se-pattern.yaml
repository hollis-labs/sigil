alias: Pattern
description: Architecture patterns and anti-patterns observed across repos
capabilities: [search, filter, sort, paginate, create, read, update, delete]
fields:
  - name: id
    type: string
    primary: true
  - name: name
    type: string
    required: true
    searchable: true
    sortable: true
  - name: type
    type: string
    filterable: true
    values: [pattern, anti-pattern]
  - name: category
    type: string
    filterable: true
    values: [structural, behavioral, operational, security, testing]
  - name: description
    type: string
    searchable: true
  - name: repo_count
    type: number
    sortable: true
endpoints:
  list: "GET /api/patterns"
  create: "POST /api/patterns"
  read: "GET /api/patterns/{id}"
  update: "PUT /api/patterns/{id}"
  delete: "DELETE /api/patterns/{id}"
defaults:
  sort: { field: name, direction: asc }
  pageSize: 25
