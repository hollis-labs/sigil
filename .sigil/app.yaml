sigil: "1.0"
kind: app
name: "Stack Explorer"
description: "AI agent tooling research platform — stack scoring and analysis"

api:
  base_url_env: "NEXT_PUBLIC_SE_API_URL"
  base_url_default: "http://localhost:8081"
  prefix: "/api"

# Phase 3.5: providers live per-module (no app-level providers block).
# Each module declares the providers wrapping its own layout/routes.
modules:
  - id: se
    shell: se-shell
    route_group: "(explorer)"
    pages:
      - se-dashboard
      - se-repos
      - se-repo-detail
      - se-scorecards
      - se-gap-analysis
      - se-reports
      - se-patterns
      - se-findings
      - se-dimensions
      - se-settings
    providers:
      - id: lens
        datasource: Lens
        track_field: id
        label_field: name
        default: ""
        placeholder: "All Lenses"
        position: topbar
        ui_type: select

  - id: clockwork
    shell: clockwork-shell
    route_group: "(clockwork)"
    pages:
      - clockwork-board
      - clockwork-task-detail
      - clockwork-collections
      - clockwork-dashboard
      - clockwork-templates
      - clockwork-checkpoints
      - clockwork-runs
      - clockwork-models
      - clockwork-projects
      - clockwork-sprints
      - clockwork-settings
      - clockwork-plans
      - clockwork-plan-detail
    providers:
      # Shared with SE module — renderer de-dups source-file copies.
      - id: lens
        datasource: Lens
        track_field: id
        label_field: name
        default: ""
        placeholder: "All Lenses"
        position: topbar
        ui_type: select
      # Clockwork-only: custom provider migrated from
      # demo-clockwork/src/hooks/ in sprint 10 phase 2.
      - id: active-runs
        source:
          component: providers/active-runs-context.tsx
          export: ActiveRunsProvider
          includes:
            - providers/sse-active-runs-bridge.tsx
        mounts:
          - SSEActiveRunsBridge
      # ApiProvider supplies the demo's mock hooks with a fetch client.
      # clockwork-api.ts is a non-component dependency (a class), included so
      # the renderer copies it into lib/ alongside the provider source.
      - id: api
        source:
          component: providers/api-context.tsx
          export: ApiProvider
          includes:
            - providers/clockwork-api.ts

features:
  theme_toggle: true
  command_palette: true
  mobile_sidebar: true

actions:
  - label: "Add Repo"
    icon: git-fork
    page: se-repos
    query: "action=create"
  - label: "Generate Report"
    icon: file-text
    page: se-reports
    query: "action=create"
  - label: "New Comparison"
    icon: git-compare
    page: se-gap-analysis
    query: "action=create"
