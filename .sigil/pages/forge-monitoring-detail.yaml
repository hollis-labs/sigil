sigil: "1.0"
kind: page
id: forge-monitoring-detail
title: Monitoring Detail
overlay: page
module: forge

layout:
  id: root
  type: rows
  props:
    gap: 6
    padding: 6
  children:
    - type: breadcrumb
      props:
        items:
          - label: Monitoring
            href: /forge-monitoring
          - label: API Latency

    - type: columns
      props:
        justify: between
        align: center
      children:
        - type: heading
          props:
            level: 2
            text: API Latency
        - type: toggle-group
          props:
            type: single
            variant: outline
            options:
              - value: 1h
                label: 1H
              - value: 6h
                label: 6H
              - value: 24h
                label: 24H
              - value: 7d
                label: 7D
              - value: 30d
                label: 30D

    - type: grid
      props:
        columns: 4
        columns_sm: 2
        gap: 4
      children:
        - type: card
          props:
            title: P50
          children:
            - type: text
              props:
                text: 45ms

        - type: card
          props:
            title: P95
          children:
            - type: text
              props:
                text: 120ms

        - type: card
          props:
            title: P99
          children:
            - type: text
              props:
                text: 340ms

        - type: card
          props:
            title: Error Rate
          children:
            - type: text
              props:
                text: "0.12%"

    - type: grid
      props:
        columns: 2
        columns_sm: 1
        gap: 4
      children:
        - type: card
          props:
            title: Latency Over Time
            description: P50/P95/P99 — last 12 hours
          children:
            - type: chart
              props:
                type: line
                xKey: time
                showGrid: true
                showLegend: true
                series:
                  - key: p50
                    label: P50
                  - key: p95
                    label: P95
                  - key: p99
                    label: P99
                data:
                  - { time: "00:00", p50: 42, p95: 110, p99: 280 }
                  - { time: "02:00", p50: 38, p95: 105, p99: 260 }
                  - { time: "04:00", p50: 35, p95: 98, p99: 240 }
                  - { time: "06:00", p50: 40, p95: 115, p99: 290 }
                  - { time: "08:00", p50: 48, p95: 135, p99: 350 }
                  - { time: "10:00", p50: 55, p95: 160, p99: 420 }
                  - { time: "12:00", p50: 52, p95: 148, p99: 380 }
                  - { time: "14:00", p50: 58, p95: 170, p99: 450 }
                  - { time: "16:00", p50: 50, p95: 142, p99: 360 }
                  - { time: "18:00", p50: 46, p95: 128, p99: 320 }
                  - { time: "20:00", p50: 43, p95: 118, p99: 290 }
                  - { time: "22:00", p50: 40, p95: 108, p99: 270 }

        - type: card
          props:
            title: Request Volume
            description: Requests per minute — last 12 hours
          children:
            - type: chart
              props:
                type: bar
                xKey: time
                showGrid: true
                series:
                  - key: requests
                    label: Requests/min
                data:
                  - { time: "00:00", requests: 120 }
                  - { time: "02:00", requests: 85 }
                  - { time: "04:00", requests: 60 }
                  - { time: "06:00", requests: 150 }
                  - { time: "08:00", requests: 420 }
                  - { time: "10:00", requests: 580 }
                  - { time: "12:00", requests: 510 }
                  - { time: "14:00", requests: 620 }
                  - { time: "16:00", requests: 480 }
                  - { time: "18:00", requests: 350 }
                  - { time: "20:00", requests: 220 }
                  - { time: "22:00", requests: 160 }

    - type: collapsible
      props:
        title: Alert Thresholds
      children:
        - type: rows
          props:
            gap: 4
          children:
            - type: slider
              id: p95-threshold
              props:
                label: P95 Latency Threshold (ms)
                min: 50
                max: 500
                step: 10
                defaultValue: 200
            - type: slider
              id: p99-threshold
              props:
                label: P99 Latency Threshold (ms)
                min: 100
                max: 1000
                step: 25
                defaultValue: 500
            - type: slider
              id: error-rate-threshold
              props:
                label: Error Rate Threshold (%)
                min: 0
                max: 10
                step: 0.1
                defaultValue: 1

    - type: collapsible
      props:
        title: Recent Alerts
      children:
        - type: rows
          props:
            gap: 2
          children:
            - type: alert
              props:
                variant: warning
                message: "P95 latency exceeded 200ms threshold at 14:32 UTC"
            - type: alert
              props:
                variant: warning
                message: "P95 latency exceeded 200ms threshold at 09:15 UTC"
            - type: alert
              props:
                variant: default
                message: "Error rate returned to normal at 08:45 UTC"

    - type: collapsible
      props:
        title: Endpoint Breakdown
      children:
        - type: rows
          props:
            gap: 3
          children:
            - type: columns
              props:
                justify: between
                align: center
              children:
                - type: text
                  props:
                    text: "GET /api/deployments"
                - type: columns
                  props:
                    gap: 2
                    align: center
                  children:
                    - type: badge
                      props:
                        text: 32ms
                        variant: success
                    - type: progress
                      props:
                        value: 32
            - type: separator
            - type: columns
              props:
                justify: between
                align: center
              children:
                - type: text
                  props:
                    text: "POST /api/deployments"
                - type: columns
                  props:
                    gap: 2
                    align: center
                  children:
                    - type: badge
                      props:
                        text: 156ms
                        variant: warning
                    - type: progress
                      props:
                        value: 65
            - type: separator
            - type: columns
              props:
                justify: between
                align: center
              children:
                - type: text
                  props:
                    text: "GET /api/assets"
                - type: columns
                  props:
                    gap: 2
                    align: center
                  children:
                    - type: badge
                      props:
                        text: 45ms
                        variant: success
                    - type: progress
                      props:
                        value: 38
