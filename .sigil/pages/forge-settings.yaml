sigil: "1.0"
kind: page
id: forge-settings
title: Settings
overlay: page
module: forge

layout:
  id: root
  type: rows
  props:
    gap: 6
    padding: 6
  children:
    # ── Header ──────────────────────────────────
    - type: heading
      props:
        level: 1
        text: Settings

    # ── Tabs ────────────────────────────────────
    - type: tabs
      props:
        defaultTab: general
      children:
        # General Tab
        - type: tab
          props:
            label: General
            value: general
          children:
            - type: card
              props:
                title: Workspace Settings
              children:
                - type: rows
                  props:
                    gap: 4
                  children:
                    - type: rows
                      props:
                        gap: 1
                      children:
                        - type: text
                          props:
                            text: Workspace Name
                            muted: true
                        - type: input
                          props:
                            placeholder: My Workspace
                    - type: rows
                      props:
                        gap: 1
                      children:
                        - type: text
                          props:
                            text: Workspace Slug
                            muted: true
                        - type: input
                          props:
                            placeholder: my-workspace
                    - type: rows
                      props:
                        gap: 1
                      children:
                        - type: text
                          props:
                            text: Default Environment
                            muted: true
                        - type: select
                          props:
                            placeholder: Select environment
                            options:
                              - value: production
                                label: Production
                              - value: staging
                                label: Staging
                              - value: preview
                                label: Preview
                    - type: button
                      props:
                        label: Save Changes
                        variant: primary

            - type: accordion
              children:
                - type: accordion-item
                  props:
                    title: What happens when I change the workspace slug?
                    value: faq-slug
                  children:
                    - type: text
                      props:
                        text: "Changing the workspace slug will update all URLs. Existing links will redirect for 30 days."
                        muted: true
                - type: accordion-item
                  props:
                    title: Can I switch environments after deploying?
                    value: faq-env
                  children:
                    - type: text
                      props:
                        text: "Yes, you can promote deployments between environments from the deployment detail page."
                        muted: true
                - type: accordion-item
                  props:
                    title: How do I reset my API keys?
                    value: faq-keys
                  children:
                    - type: text
                      props:
                        text: "Go to Settings → Integrations and regenerate the API key. The old key is revoked immediately."
                        muted: true

        # Notifications Tab
        - type: tab
          props:
            label: Notifications
            value: notifications
          children:
            - type: card
              props:
                title: Notification Preferences
              children:
                - type: rows
                  props:
                    gap: 4
                  children:
                    - type: switch
                      props:
                        label: Email notifications for failed deployments
                        default: true
                    - type: switch
                      props:
                        label: Slack alerts for infrastructure issues
                        default: true
                    - type: switch
                      props:
                        label: Weekly usage digest
                    - type: switch
                      props:
                        label: Security alerts
                        default: true
                    - type: separator
                    - type: button
                      props:
                        label: Save Preferences
                        variant: primary

        # Danger Zone Tab
        - type: tab
          props:
            label: Danger Zone
            value: danger
          children:
            - type: card
              props:
                title: Danger Zone
              children:
                - type: rows
                  props:
                    gap: 4
                  children:
                    - type: columns
                      props:
                        justify: between
                        align: center
                      children:
                        - type: rows
                          props:
                            gap: 0
                          children:
                            - type: text
                              props:
                                text: Delete Workspace
                            - type: text
                              props:
                                text: Permanently delete this workspace and all data
                                muted: true
                        - type: confirm-dialog
                          props:
                            title: Delete Workspace
                            message: This action cannot be undone. This will permanently delete your workspace and remove all associated data.
                            confirmLabel: Delete
                            variant: destructive
                          children:
                            - type: button
                              props:
                                label: Delete Workspace
                                variant: destructive
                    - type: separator
                    - type: columns
                      props:
                        justify: between
                        align: center
                      children:
                        - type: rows
                          props:
                            gap: 0
                          children:
                            - type: text
                              props:
                                text: Transfer Ownership
                            - type: text
                              props:
                                text: Transfer workspace to another user
                                muted: true
                        - type: button
                          props:
                            label: Transfer
                            variant: outline
