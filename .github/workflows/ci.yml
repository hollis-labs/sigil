name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v5
        with:
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - name: pins match the Substrate BOM
        run: go run github.com/hollis-labs/substrate/cmd/substrate pins check --app .
      - run: go test -p 2 -race -count=1 -timeout=5m ./...
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
          args: --config .golangci.yml --timeout=5m ./...
      # Tree only. The history gate (--ref HEAD) returns after the program-wide history pass.
      - name: hygiene (secrets, hosts, private paths; tree)
        run: python3 scripts/scan-public --tree
