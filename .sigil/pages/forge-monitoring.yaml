sigil: "1.0"
kind: page
id: forge-monitoring
title: Monitoring
overlay: page
module: forge

layout:
  id: root
  type: rows
  props:
    gap: 6
    padding: 6
  children:
    # ── Header ──────────────────────────────────
    - id: header
      type: columns
      props:
        justify: between
        align: center
      children:
        - type: heading
          props:
            level: 1
            text: Monitoring
        - type: columns
          props:
            gap: 2
          children:
            - type: select
              props:
                placeholder: Last hour
                options:
                  - value: 1h
                    label: Last hour
                  - value: 6h
                    label: Last 6 hours
                  - value: 24h
                    label: Last 24 hours
                  - value: 7d
                    label: Last 7 days
                  - value: 30d
                    label: Last 30 days
            - type: button
              props:
                label: Configure Alerts
                variant: ghost
                icon: bell
              actions:
                click:
                  type: navigate
                  page: forge-alerts

    # ── Status Cards ────────────────────────────
    - type: grid
      props:
        columns: 4
        gap: 4
      children:
        - type: card
          props:
            title: CPU Usage
            padding: 4
          children:
            - type: columns
              props:
                justify: between
                align: center
              children:
                - type: rows
                  props:
                    gap: 1
                  children:
                    - type: heading
                      props:
                        level: 2
                        text: "73%"
                    - type: text
                      props:
                        text: "avg across 12 servers"
                        muted: true
            - type: progress
              props:
                value: 73

        - type: card
          props:
            title: Memory
            padding: 4
          children:
            - type: columns
              props:
                justify: between
                align: center
              children:
                - type: rows
                  props:
                    gap: 1
                  children:
                    - type: heading
                      props:
                        level: 2
                        text: "61%"
                    - type: text
                      props:
                        text: "18.3 GB / 30 GB"
                        muted: true
            - type: progress
              props:
                value: 61

        - type: card
          props:
            title: Disk I/O
            padding: 4
          children:
            - type: columns
              props:
                justify: between
                align: center
              children:
                - type: rows
                  props:
                    gap: 1
                  children:
                    - type: heading
                      props:
                        level: 2
                        text: "24%"
                    - type: text
                      props:
                        text: "Read: 1.2 GB/s Write: 340 MB/s"
                        muted: true
            - type: progress
              props:
                value: 24

        - type: card
          props:
            title: Network
            padding: 4
          children:
            - type: columns
              props:
                justify: between
                align: center
              children:
                - type: rows
                  props:
                    gap: 1
                  children:
                    - type: heading
                      props:
                        level: 2
                        text: "892 Mbps"
                    - type: text
                      props:
                        text: "In: 540 Mbps Out: 352 Mbps"
                        muted: true
                - type: badge
                  props:
                    text: Normal
                    variant: info

    # ── Charts ──────────────────────────────────
    - type: grid
      props:
        columns: 3
        columns_sm: 1
        gap: 4
      children:
        - type: card
          props:
            title: CPU Over Time
            description: Average CPU usage — last 12 hours
          children:
            - type: chart
              props:
                type: area
                xKey: time
                series:
                  - key: cpu
                    label: CPU %
                data:
                  - { time: "00:00", cpu: 45 }
                  - { time: "02:00", cpu: 38 }
                  - { time: "04:00", cpu: 32 }
                  - { time: "06:00", cpu: 41 }
                  - { time: "08:00", cpu: 62 }
                  - { time: "10:00", cpu: 78 }
                  - { time: "12:00", cpu: 73 }
                  - { time: "14:00", cpu: 81 }
                  - { time: "16:00", cpu: 75 }
                  - { time: "18:00", cpu: 58 }
                  - { time: "20:00", cpu: 49 }
                  - { time: "22:00", cpu: 42 }

        - type: card
          props:
            title: Error Rate by Service
            description: Errors in the last 24 hours
          children:
            - type: chart
              props:
                type: donut
                xKey: service
                showLegend: true
                series:
                  - key: errors
                    label: Errors
                data:
                  - { service: "api", errors: 42, fill: "var(--color-api)" }
                  - { service: "auth", errors: 18, fill: "var(--color-auth)" }
                  - { service: "worker", errors: 7, fill: "var(--color-worker)" }
                  - { service: "cdn", errors: 3, fill: "var(--color-cdn)" }

        - type: card
          props:
            title: Memory Usage
            description: Memory allocation — last 12 hours
          children:
            - type: chart
              props:
                type: bar
                xKey: time
                showGrid: true
                series:
                  - key: used
                    label: Used (GB)
                  - key: cached
                    label: Cached (GB)
                stacked: true
                data:
                  - { time: "00:00", used: 14, cached: 4 }
                  - { time: "02:00", used: 13, cached: 5 }
                  - { time: "04:00", used: 12, cached: 5 }
                  - { time: "06:00", used: 15, cached: 4 }
                  - { time: "08:00", used: 19, cached: 3 }
                  - { time: "10:00", used: 22, cached: 3 }
                  - { time: "12:00", used: 21, cached: 4 }
                  - { time: "14:00", used: 23, cached: 3 }
                  - { time: "16:00", used: 20, cached: 4 }
                  - { time: "18:00", used: 17, cached: 5 }
                  - { time: "20:00", used: 15, cached: 5 }
                  - { time: "22:00", used: 14, cached: 5 }

    # ── Service Health ──────────────────────────
    - type: card
      props:
        title: Service Health
      children:
        - type: rows
          props:
            gap: 3
          children:
            - type: columns
              props:
                justify: between
                align: center
              children:
                - type: rows
                  props:
                    gap: 0
                  children:
                    - type: text
                      props:
                        text: "api-gateway"
                    - type: text
                      props:
                        text: "api.forge.dev"
                        muted: true
                - type: columns
                  props:
                    gap: 2
                    align: center
                  children:
                    - type: badge
                      props:
                        text: Healthy
                        variant: success
                    - type: text
                      props:
                        text: "12ms"
                        muted: true
            - type: separator
            - type: columns
              props:
                justify: between
                align: center
              children:
                - type: rows
                  props:
                    gap: 0
                  children:
                    - type: text
                      props:
                        text: "auth-service"
                    - type: text
                      props:
                        text: "auth.forge.dev"
                        muted: true
                - type: columns
                  props:
                    gap: 2
                    align: center
                  children:
                    - type: badge
                      props:
                        text: Healthy
                        variant: success
                    - type: text
                      props:
                        text: "8ms"
                        muted: true
            - type: separator
            - type: columns
              props:
                justify: between
                align: center
              children:
                - type: rows
                  props:
                    gap: 0
                  children:
                    - type: text
                      props:
                        text: "worker-pool"
                    - type: text
                      props:
                        text: "workers.forge.dev"
                        muted: true
                - type: columns
                  props:
                    gap: 2
                    align: center
                  children:
                    - type: badge
                      props:
                        text: Degraded
                        variant: warning
                    - type: text
                      props:
                        text: "340ms"
                        muted: true
            - type: separator
            - type: columns
              props:
                justify: between
                align: center
              children:
                - type: rows
                  props:
                    gap: 0
                  children:
                    - type: text
                      props:
                        text: "cdn-edge"
                    - type: text
                      props:
                        text: "cdn.forge.dev"
                        muted: true
                - type: columns
                  props:
                    gap: 2
                    align: center
                  children:
                    - type: badge
                      props:
                        text: Healthy
                        variant: success
                    - type: text
                      props:
                        text: "3ms"
                        muted: true
            - type: separator
            - type: columns
              props:
                justify: between
                align: center
              children:
                - type: rows
                  props:
                    gap: 0
                  children:
                    - type: text
                      props:
                        text: "database-primary"
                    - type: text
                      props:
                        text: "db.forge.dev:5432"
                        muted: true
                - type: columns
                  props:
                    gap: 2
                    align: center
                  children:
                    - type: badge
                      props:
                        text: Healthy
                        variant: success
                    - type: text
                      props:
                        text: "2ms"
                        muted: true
            - type: separator
            - type: columns
              props:
                justify: between
                align: center
              children:
                - type: rows
                  props:
                    gap: 0
                  children:
                    - type: text
                      props:
                        text: "database-replica"
                    - type: text
                      props:
                        text: "db-ro.forge.dev:5432"
                        muted: true
                - type: columns
                  props:
                    gap: 2
                    align: center
                  children:
                    - type: badge
                      props:
                        text: Down
                        variant: danger
                    - type: text
                      props:
                        text: "timeout"
                        muted: true

    # ── Bottom Row ──────────────────────────────
    - type: columns
      props:
        gap: 4
      children:
        # Recent Alerts
        - type: card
          props:
            title: Recent Alerts
          children:
            - type: rows
              props:
                gap: 3
              children:
                - type: columns
                  props:
                    gap: 3
                    align: center
                  children:
                    - type: icon
                      props:
                        name: x-circle
                        size: sm
                    - type: rows
                      props:
                        gap: 0
                      children:
                        - type: text
                          props:
                            text: "Database replica connection timeout"
                        - type: text
                          props:
                            text: "2 minutes ago"
                            muted: true
                    - type: badge
                      props:
                        text: Critical
                        variant: danger
                - type: separator
                - type: columns
                  props:
                    gap: 3
                    align: center
                  children:
                    - type: icon
                      props:
                        name: alert-triangle
                        size: sm
                    - type: rows
                      props:
                        gap: 0
                      children:
                        - type: text
                          props:
                            text: "Worker pool response time exceeded 300ms"
                        - type: text
                          props:
                            text: "15 minutes ago"
                            muted: true
                    - type: badge
                      props:
                        text: Warning
                        variant: warning
                - type: separator
                - type: columns
                  props:
                    gap: 3
                    align: center
                  children:
                    - type: icon
                      props:
                        name: alert-triangle
                        size: sm
                    - type: rows
                      props:
                        gap: 0
                      children:
                        - type: text
                          props:
                            text: "Disk usage above 80% on srv-03"
                        - type: text
                          props:
                            text: "1 hour ago"
                            muted: true
                    - type: badge
                      props:
                        text: Warning
                        variant: warning
                - type: separator
                - type: columns
                  props:
                    gap: 3
                    align: center
                  children:
                    - type: icon
                      props:
                        name: alert-triangle
                        size: sm
                    - type: rows
                      props:
                        gap: 0
                      children:
                        - type: text
                          props:
                            text: "SSL certificate expires in 7 days"
                        - type: text
                          props:
                            text: "3 hours ago"
                            muted: true
                    - type: badge
                      props:
                        text: Info
                        variant: info

        # Uptime (30 days)
        - type: card
          props:
            title: "Uptime (30 days)"
          children:
            - type: rows
              props:
                gap: 3
              children:
                - type: columns
                  props:
                    justify: between
                  children:
                    - type: text
                      props:
                        text: "api-gateway"
                    - type: text
                      props:
                        text: "99.99%"
                - type: progress
                  props:
                    value: 99
                - type: columns
                  props:
                    justify: between
                  children:
                    - type: text
                      props:
                        text: "auth-service"
                    - type: text
                      props:
                        text: "99.97%"
                - type: progress
                  props:
                    value: 99
                - type: columns
                  props:
                    justify: between
                  children:
                    - type: text
                      props:
                        text: "worker-pool"
                    - type: text
                      props:
                        text: "98.50%"
                - type: progress
                  props:
                    value: 98
                - type: columns
                  props:
                    justify: between
                  children:
                    - type: text
                      props:
                        text: "cdn-edge"
                    - type: text
                      props:
                        text: "100%"
                - type: progress
                  props:
                    value: 100
                - type: columns
                  props:
                    justify: between
                  children:
                    - type: text
                      props:
                        text: "database-primary"
                    - type: text
                      props:
                        text: "99.95%"
                - type: progress
                  props:
                    value: 99
