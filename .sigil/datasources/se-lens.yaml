alias: Lens
description: Scoring lenses — perspectives that reweight dimensions
capabilities: [search, paginate, create, read, delete]
fields:
  - name: id
    type: string
    primary: true
  - name: name
    type: string
    required: true
    searchable: true
    sortable: true
  - name: description
    type: string
  - name: dimension_count
    type: number
endpoints:
  list: "GET /api/lenses"
  create: "POST /api/lenses"
  read: "GET /api/lenses/{id}"
  delete: "DELETE /api/lenses/{id}"
defaults:
  sort: { field: name, direction: asc }
  pageSize: 25
