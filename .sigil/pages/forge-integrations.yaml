sigil: "1.0"
kind: page
id: forge-integrations
title: Integrations
overlay: page
module: forge

datasources:
  - alias: Integration
    capabilities: [list]

layout:
  id: root
  type: rows
  props:
    gap: 6
    padding: 6
  children:
    # ── Header ──────────────────────────────────
    - id: header
      type: columns
      props:
        justify: between
        align: center
      children:
        - type: heading
          props:
            level: 1
            text: Integrations
        - type: button
          props:
            label: Add Integration
            variant: primary
            icon: plug
          actions:
            click:
              type: navigate
              page: forge-integrations

    # ── Integration Cards Grid ──────────────────
    - type: grid
      props:
        columns: 3
        gap: 4
        datasource: Integration
      children:
        - type: card
          props:
            title: "{{item.name}}"
            description: "{{item.provider}}"
          children:
            - type: columns
              props:
                justify: between
                align: center
              children:
                - type: badge
                  props:
                    text: "{{item.status}}"
                    variant: success
                - type: text
                  props:
                    text: "{{item.connectedAt}}"
                    muted: true
            - type: separator
            - type: dialog
              props:
                trigger: Configure
                triggerVariant: outline
                title: Integration Settings
                description: Update the configuration for this integration.
              children:
                - type: rows
                  props:
                    gap: 4
                  children:
                    - type: input
                      props:
                        label: API Key
                        placeholder: Enter API key...
                        type: password
                    - type: input
                      props:
                        label: Webhook URL
                        placeholder: https://...
                    - type: button
                      props:
                        label: Save Configuration
                        variant: primary
